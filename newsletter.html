<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스레터 설문 추적</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1420;--bg2:#1a2032;--bg3:#252d42;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#eef1f7;--text2:#9aa3b8;--text3:#5a6478;
  --accent:#5b8def;--accent2:#7ba5f5;--green:#4ade80;--amber:#fbbf24;--coral:#f87171;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:14px;color:var(--text3);}

/* 공통 컨테이너 */
.container{max-width:760px;margin:0 auto;padding:32px 24px 80px;}

/* ─── 독자 확인 페이지 ─── */
.thanks-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
.thanks-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:pop 0.4s ease;}
@keyframes pop{from{opacity:0;transform:scale(0.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.thanks-check{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--green),#22c55e);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px;box-shadow:0 8px 24px rgba(74,222,128,0.3);}
.thanks-title{font-size:24px;font-weight:700;margin-bottom:12px;}
.thanks-msg{font-size:15px;color:var(--text2);line-height:1.8;margin-bottom:8px;}
.thanks-choice{display:inline-block;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:8px 18px;margin-top:20px;font-size:14px;color:var(--accent2);font-weight:500;}
.thanks-footer{margin-top:32px;font-size:12px;color:var(--text3);}

/* ─── 관리자 페이지 ─── */
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
.admin-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;}
.admin-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;}
.admin-sub{font-size:13px;color:var(--text2);margin-top:2px;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px;}
.card-label{font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}

.input-field{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color 0.15s;}
.input-field:focus{border-color:var(--accent);}
.input-field::placeholder{color:var(--text3);}

.question-input{font-size:16px;font-weight:500;margin-bottom:16px;}

.option-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.option-drag{color:var(--text3);font-size:14px;cursor:default;}
.option-input{flex:1;}
.option-remove{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text3);cursor:pointer;font-size:14px;padding:8px 11px;flex-shrink:0;}
.option-remove:hover{border-color:var(--coral);color:var(--coral);}

.add-option-btn{background:transparent;border:1px dashed var(--border2);border-radius:8px;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:10px;width:100%;margin-top:4px;transition:all 0.15s;}
.add-option-btn:hover{border-color:var(--accent);color:var(--accent);}

.save-btn{background:var(--accent);border:none;border-radius:8px;color:#fff;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;padding:12px 24px;margin-top:16px;transition:all 0.15s;}
.save-btn:hover{background:var(--accent2);}

/* 결과 (막대그래프) */
.result-item{margin-bottom:18px;}
.result-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.result-label{font-size:14px;font-weight:500;}
.result-count{font-size:13px;color:var(--text2);}
.result-count b{color:var(--accent2);font-size:15px;}
.result-bar-bg{height:10px;background:var(--bg3);border-radius:6px;overflow:hidden;}
.result-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width 0.6s ease;min-width:2px;}
.result-pct{font-size:11px;color:var(--text3);margin-top:3px;}

.total-clicks{text-align:center;padding:16px;background:var(--bg3);border-radius:10px;margin-bottom:20px;}
.total-clicks .num{font-size:32px;font-weight:700;color:var(--accent2);}
.total-clicks .lbl{font-size:12px;color:var(--text2);margin-top:2px;}

/* 링크 목록 */
.link-item{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.link-item-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.link-opt-name{font-size:14px;font-weight:500;color:var(--accent2);}
.link-opt-clicks{font-size:12px;color:var(--text2);margin-left:auto;}
.link-url-row{display:flex;gap:8px;align-items:center;}
.link-url{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:11px;padding:7px 10px;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.copy-btn{background:transparent;border:1px solid var(--border2);border-radius:6px;color:var(--text2);cursor:pointer;font-size:11px;padding:7px 12px;white-space:nowrap;}
.copy-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

.info-box{background:rgba(91,141,239,0.08);border:1px solid rgba(91,141,239,0.2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:20px;}
.info-box b{color:var(--accent2);}

.refresh-btn{background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:8px 16px;}
.refresh-btn:hover{background:var(--bg3);}

.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-size:13px;padding:11px 22px;border-radius:24px;opacity:0;transition:all 0.3s;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.tabs{display:flex;gap:2px;background:var(--bg2);padding:4px;border-radius:10px;margin-bottom:24px;}
.tab{flex:1;background:transparent;border:none;border-radius:7px;color:var(--text2);cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;padding:10px;transition:all 0.15s;}
.tab.active{background:var(--bg3);color:var(--text);}

.panel{display:none;}
.panel.active{display:block;}

@media(max-width:600px){
  .container{padding:24px 16px 60px;}
  .thanks-card{padding:36px 24px;}
}
</style>
</head>
<body>

<div id="app"><div class="loading">불러오는 중...</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDDyRxHF4-7vmRwuBdZVgIl5D7wXDa7Qag",
  authDomain: "happy-birthday-ch.firebaseapp.com",
  projectId: "happy-birthday-ch",
  storageBucket: "happy-birthday-ch.firebasestorage.app",
  messagingSenderId: "466279772788",
  appId: "1:466279772788:web:bd0fd6ec0daba4aa9fd721"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'admin' ? 'admin' : 'reader';
const CLICK_OPT = params.get('opt'); // 독자가 클릭한 보기 인덱스
const BASE_URL = location.origin + location.pathname;
const DOC_ID = 'newsletter_survey';

let survey = {
  question: '이번 뉴스레터에서 가장 관심 있는 주제는 무엇인가요?',
  options: [
    { text: '신제품 소식', clicks: 0 },
    { text: '이벤트/프로모션', clicks: 0 },
    { text: '브랜드 스토리', clicks: 0 },
  ],
  thanksTitle: '참여해 주셔서 감사합니다!',
  thanksMsg: '소중한 의견이 정상적으로 전달되었어요.\n더 좋은 콘텐츠로 찾아뵙겠습니다.'
};
let opinions = [];

async function loadSurvey() {
  const snap = await getDoc(doc(db, 'survey', DOC_ID));
  if (snap.exists()) survey = { ...survey, ...snap.data() };
}

async function loadOpinions() {
  try {
    const q = query(collection(db, 'survey_opinions'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    opinions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { opinions = []; }
}

async function addOpinion(optIndex, optText, text) {
  await addDoc(collection(db, 'survey_opinions'), {
    optIndex, optText, text, createdAt: Date.now()
  });
}

async function saveSurvey() {
  await setDoc(doc(db, 'survey', DOC_ID), survey);
}

async function recordClick(optIndex) {
  const field = `options.${optIndex}.clicks`;
  try {
    await updateDoc(doc(db, 'survey', DOC_ID), { [`clickCounts.${optIndex}`]: increment(1) });
  } catch(e) {
    // 문서가 없으면 생성
    await saveSurvey();
    await updateDoc(doc(db, 'survey', DOC_ID), { [`clickCounts.${optIndex}`]: increment(1) });
  }
}

async function init() {
  await loadSurvey();

  // 독자가 보기를 클릭해서 들어온 경우
  if (MODE === 'reader' && CLICK_OPT !== null) {
    await recordClick(CLICK_OPT);
    renderThanks(parseInt(CLICK_OPT));
    return;
  }

  if (MODE === 'admin') {
    await loadOpinions();
    renderAdmin();
  } else {
    renderReaderLanding();
  }
}

function getClicks(i) {
  return (survey.clickCounts && survey.clickCounts[i]) || 0;
}

// ─── 독자: 참여 감사 페이지 ───
function renderThanks(optIndex) {
  const opt = survey.options[optIndex];
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="thanks-page">
      <div class="thanks-card">
        <div class="thanks-check">✓</div>
        <div class="thanks-title">${survey.thanksTitle || '참여해 주셔서 감사합니다!'}</div>
        <div class="thanks-msg">${(survey.thanksMsg || '').replace(/\n/g,'<br>')}</div>
        ${opt ? `<div class="thanks-choice">선택하신 항목: ${opt.text}</div>` : ''}
        <div id="opinionArea" style="margin-top:24px;text-align:left;">
          <label style="font-size:13px;color:var(--text2);display:block;margin-bottom:8px;">💬 자유롭게 의견을 남겨주세요 (선택)</label>
          <textarea id="opinionInput" class="input-field" style="resize:vertical;min-height:80px;line-height:1.7;" placeholder="여러분의 소중한 의견을 들려주세요"></textarea>
          <button id="opinionBtn" class="save-btn" style="width:100%;margin-top:10px;" onclick="submitOpinion(${optIndex})">의견 남기기</button>
        </div>
        <div class="thanks-footer">이 창은 닫으셔도 됩니다 :)</div>
      </div>
    </div>
  `;
}

window.submitOpinion = async (optIndex) => {
  const input = document.getElementById('opinionInput');
  const text = input.value.trim();
  if (!text) { showToast('의견을 입력해주세요'); return; }
  const btn = document.getElementById('opinionBtn');
  btn.disabled = true; btn.textContent = '전송 중...';
  const opt = survey.options[optIndex];
  await addOpinion(optIndex, opt ? opt.text : '', text);
  document.getElementById('opinionArea').innerHTML = '<div style="text-align:center;color:var(--green);font-size:14px;padding:12px;">✓ 의견이 전달되었어요. 감사합니다!</div>';
};

// ─── 독자: 랜딩(설문 미리보기) ───
function renderReaderLanding() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="container">
      <div class="card">
        <div class="card-label">설문</div>
        <div style="font-size:18px;font-weight:500;margin-bottom:20px;">${survey.question}</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${survey.options.map((o,i) => `
            <a href="${BASE_URL}?opt=${i}" style="display:block;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px 18px;text-decoration:none;color:var(--text);font-size:15px;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">${o.text}</a>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

// ─── 관리자 페이지 ───
function renderAdmin() {
  const app = document.getElementById('app');
  const totalClicks = survey.options.reduce((s,_,i) => s + getClicks(i), 0);

  app.innerHTML = `
    <div class="container">
      <div class="admin-header">
        <div>
          <div class="admin-title"><span class="admin-badge">관리자</span>뉴스레터 설문 추적</div>
          <div class="admin-sub">설문 항목을 수정하고 클릭수를 확인하세요</div>
        </div>
        <button class="refresh-btn" onclick="location.reload()">↻ 새로고침</button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchPanel('edit',this)">설문 편집</button>
        <button class="tab" onclick="switchPanel('result',this)">결과 보기</button>
        <button class="tab" onclick="switchPanel('links',this)">삽입 링크</button>
      </div>

      <!-- 편집 패널 -->
      <div class="panel active" id="panel-edit">
        <div class="card">
          <div class="card-label">설문 질문</div>
          <input class="input-field question-input" id="qInput" value="${survey.question.replace(/"/g,'&quot;')}" placeholder="설문 질문을 입력하세요" />
          <div class="card-label" style="margin-top:8px;">보기 항목</div>
          <div id="optionsList"></div>
          <button class="add-option-btn" onclick="addOption()">+ 보기 추가</button>
          <button class="save-btn" onclick="saveEdits()">저장하기</button>
        </div>
        <div class="card">
          <div class="card-label">참여 감사 페이지 문구</div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">독자가 보기를 클릭하면 보게 되는 페이지예요</div>
          <input class="input-field" id="thanksTitleInput" value="${(survey.thanksTitle||'').replace(/"/g,'&quot;')}" placeholder="감사 페이지 제목" style="margin-bottom:10px;" />
          <textarea class="input-field" id="thanksMsgInput" style="resize:vertical;min-height:70px;line-height:1.7;" placeholder="감사 페이지 안내 문구">${survey.thanksMsg||''}</textarea>
          <button class="save-btn" onclick="saveThanks()">감사 문구 저장</button>
        </div>
        <div class="info-box">
          ⚠ <b>주의:</b> 보기 항목을 <b>추가/삭제</b>하면 순서가 바뀌어 클릭수 집계가 섞일 수 있어요. 발송 전에 설문을 확정하는 걸 권장해요.
        </div>
      </div>

      <!-- 결과 패널 -->
      <div class="panel" id="panel-result">
        <div class="total-clicks">
          <div class="num">${totalClicks}</div>
          <div class="lbl">총 클릭수</div>
        </div>
        <div class="card">
          <div class="card-label">보기별 클릭 결과</div>
          ${survey.options.map((o,i) => {
            const c = getClicks(i);
            const pct = totalClicks ? Math.round(c/totalClicks*100) : 0;
            return `
              <div class="result-item">
                <div class="result-head">
                  <span class="result-label">${o.text}</span>
                  <span class="result-count"><b>${c}</b>회</span>
                </div>
                <div class="result-bar-bg"><div class="result-bar" style="width:${pct}%"></div></div>
                <div class="result-pct">${pct}%</div>
              </div>
            `;
          }).join('')}
        </div>
        <div class="card">
          <div class="card-label">독자 의견 ${opinions.length}개</div>
          ${opinions.length ? opinions.map(op => `
            <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
                <span style="font-size:11px;font-weight:500;color:var(--accent2);background:rgba(91,141,239,0.12);padding:2px 8px;border-radius:10px;">${op.optText||'항목'}</span>
                <span style="font-size:11px;color:var(--text3);">${new Date(op.createdAt).toLocaleString('ko-KR')}</span>
              </div>
              <div style="font-size:13px;color:var(--text);line-height:1.6;white-space:pre-wrap;">${op.text}</div>
            </div>
          `).join('') : '<div style="text-align:center;color:var(--text3);padding:24px;font-size:13px;">아직 남겨진 의견이 없어요</div>'}
        </div>
      </div>

      <!-- 링크 패널 -->
      <div class="panel" id="panel-links">
        <div class="info-box">
          각 보기의 링크를 복사해서 <b>뉴스레터 메일의 해당 버튼/텍스트에 연결</b>하세요.<br>
          독자가 클릭하면 클릭수가 집계되고 '참여 감사' 페이지가 표시됩니다.
        </div>
        <div class="card">
          <div class="card-label">보기별 삽입 링크</div>
          ${survey.options.map((o,i) => `
            <div class="link-item">
              <div class="link-item-head">
                <span class="link-opt-name">${o.text}</span>
                <span class="link-opt-clicks">${getClicks(i)}회 클릭</span>
              </div>
              <div class="link-url-row">
                <span class="link-url">${BASE_URL}?opt=${i}</span>
                <button class="copy-btn" onclick="copyLink(${i})">복사</button>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="card">
          <div class="card-label">독자 미리보기 링크</div>
          <div class="link-url-row">
            <span class="link-url">${BASE_URL}</span>
            <button class="copy-btn" onclick="copyBase()">복사</button>
          </div>
        </div>
      </div>
    </div>
  `;
  renderOptionsList();
}

function renderOptionsList() {
  const el = document.getElementById('optionsList');
  if (!el) return;
  el.innerHTML = survey.options.map((o,i) => `
    <div class="option-row">
      <span class="option-drag">${i+1}</span>
      <input class="input-field option-input" data-idx="${i}" value="${o.text.replace(/"/g,'&quot;')}" placeholder="보기 ${i+1}" />
      <button class="option-remove" onclick="removeOption(${i})">✕</button>
    </div>
  `).join('');
}

window.addOption = () => {
  survey.options.push({ text: '' });
  renderOptionsList();
};

window.removeOption = (i) => {
  if (survey.options.length <= 2) { showToast('보기는 최소 2개 필요해요'); return; }
  survey.options.splice(i, 1);
  renderOptionsList();
};

window.saveEdits = async () => {
  survey.question = document.getElementById('qInput').value.trim() || survey.question;
  const inputs = document.querySelectorAll('.option-input');
  survey.options = [...inputs].map((inp,i) => ({
    text: inp.value.trim() || `보기 ${i+1}`
  }));
  await saveSurvey();
  showToast('저장됐어요!');
  setTimeout(() => location.reload(), 800);
};

window.saveThanks = async () => {
  survey.thanksTitle = document.getElementById('thanksTitleInput').value.trim() || '참여해 주셔서 감사합니다!';
  survey.thanksMsg = document.getElementById('thanksMsgInput').value.trim();
  await saveSurvey();
  showToast('감사 문구가 저장됐어요!');
};

window.switchPanel = (name, btn) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
};

window.copyLink = (i) => {
  navigator.clipboard.writeText(`${BASE_URL}?opt=${i}`).then(() => showToast('링크가 복사됐어요!'));
};
window.copyBase = () => {
  navigator.clipboard.writeText(BASE_URL).then(() => showToast('링크가 복사됐어요!'));
};

window.showToast = (msg) => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
};

init();
</script>
</body>
</html>
